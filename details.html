<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="manifest.json" />
    <script>
      // Prevent FOUC for dark mode
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark-mode');
      }
    </script>
    <title>Detalles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="app-container details-container">
      
      <!-- Details Header -->
      <header class="header details-header">
        <button class="back-btn" onclick="window.location.href='index.html'" aria-label="Volver">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h1 id="metric-title">Cargando...</h1>
        <div style="width: 44px;"></div> <!-- Spacer to center title -->
      </header>

      <main class="dashboard details-main">
         
         <div class="card chart-card">
            <div class="chart-header">
                <div class="chart-value-container">
                    <span class="value" id="current-value">--</span>
                    <span class="unit" id="current-unit">--</span>
                </div>
            </div>

            <!-- Time Range Filters -->
            <div class="time-filters">
                <button class="filter-btn active" data-range="1d">1 Día</button>
                <button class="filter-btn" data-range="1w">1 Sem</button>
                <button class="filter-btn" data-range="1m">1 Mes</button>
                <button class="filter-btn" data-range="3m">90 Días</button>
            </div>

            <!-- Chart Canvas -->
            <div class="chart-container" style="position: relative; height:50vh; width:100%">
                <canvas id="metricChart"></canvas>
            </div>
         </div>

      </main>
    </div>
    
    <script type="module" src="details.js"></script>
    <script src="theme.js"></script>
  </body>
</html>
